name: Build APK

# Compila la app en GitHub y deja el APK para descargar (Actions > la ejecución > Artifacts).
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas unitarias (rama temporal, se puede borrar)
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-pruebas
          path: app/build/test-results/testDebugUnitTest/*.xml
